<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Portal - Talash AI Recruiter</title>

<style>
  
  body{
font-family:Arial,sans-serif;
background:#f4f7fb;
padding:50px;
}

.container{
background:white;
max-width:400px;
margin:auto;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
text-align:center;
}

h1{
color:#2563eb;
}

 input{
width:90%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

.btn{
background:#2563eb;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
cursor:pointer;
text-decoration:none;
display:inline-block;
margin-top:10px;
}

.btn:hover{
background:#1e40af;
}

</style>

</head>

 <body>

<div class="container">

<h1>Candidate Login</h1>

<input type="email" placeholder="Email Address">

 <input type="password" placeholder="Password">

 <br>

<button class="btn">Login</button>

 <br><br>

 <a href="register.html" class="btn">Register</a>

 </div>

 </body>
</html>
