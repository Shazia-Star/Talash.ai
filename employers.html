<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employer Portal - Talash AI Recruiter</title>

 <style>
body{
font-family: Arial, sans-serif;
margin:0;
background:#f4f7fc;
}

 header{
background:#0f172a;
color:white;
text-align:center;
padding:25px;
}

.container{
max-width:900px;
margin:40px auto;
display:flex;
gap:30px;
flex-wrap:wrap;
justify-content:center;
}

.card{
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
width:350px;
}

 h2{
text-align:center;
color:#0f172a;
}

 input{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:6px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#1d4ed8;
}

.home-btn{
display:inline-block;
margin-top:20px;
background:#10b981;
color:white;
padding:10px 20px;
text-decoration:none;
border-radius:6px;
}

.home-btn:hover{
background:#059669;
}
</style>

</head>

 <body>

 <header>
<h1>Employer Portal</h1>
<p>Recruiter Login & Registration</p>

 <a href="index.html" class="homeiv class="container">

 <div class="card">
<h2>Recruiter Login</h2>

 <form>
<input type="email" placeholder="Email Address" required>

<input type="password" placeholder="Password" required>

 <button type="submit">Login</button>
</form>
</div>

 <div class="card">
<h2>Recruiter Register</h2>

 <form>
<input type="text" placeholder="Company Name" required>

 <input type="text" placeholder="Recruiter Name" required>

 <input type="email" placeholder="Email Address" required>

<input type="password" placeholder="Create Password" required>

 <button type="submit">Register</button>
</form>
</div>

 </div>

 </body>
</html>
